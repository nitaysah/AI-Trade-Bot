# Rotate the BotBulls backend log without restarting the service.
# Install (as root):  cp backend/logrotate.botbulls.conf /etc/logrotate.d/botbulls
# Edit the path to match BOTBULLS_LOG_FILE (default: <backend dir>/stdout.log).
# copytruncate is required because start_backend.sh keeps the file open through `tee -a`.
/home/ubuntu/backend/backend/stdout.log {
    daily
    rotate 14
    maxsize 100M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0600 ubuntu ubuntu
}
