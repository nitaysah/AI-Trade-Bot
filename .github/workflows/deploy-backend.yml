name: Deploy Backend to Oracle VM

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4



      - name: Native Git Pull and Restart
        uses: appleboy/ssh-action@master
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: GROQ_API_KEY,ALPACA_API_KEY,ALPACA_SECRET_KEY,WEBULL_APP_KEY,WEBULL_APP_SECRET
          script: |
            # Clone if doesn't exist, otherwise fetch and reset
            if [ ! -d "/home/ubuntu/backend/.git" ]; then
              rm -rf /home/ubuntu/backend
              git clone git@github.com:nitaysah/AI-Trade-Bot.git /home/ubuntu/backend
            fi
            
            cd /home/ubuntu/backend
            git fetch origin
            git reset --hard origin/main
            
            # Setup virtual environment if missing, and install dependencies
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install -r backend/requirements.txt
            
            # Recreate environment variables from individual secrets
            cat <<EOF > /home/ubuntu/backend/.env
            GROQ_API_KEY=$GROQ_API_KEY
            ALPACA_API_KEY=$ALPACA_API_KEY
            ALPACA_SECRET_KEY=$ALPACA_SECRET_KEY
            ALPACA_PAPER=true
            BROKER_TYPE=alpaca
            WEBULL_APP_KEY=$WEBULL_APP_KEY
            WEBULL_APP_SECRET=$WEBULL_APP_SECRET
            WEBULL_DATA_ONLY=true
            EOF
            chmod 600 /home/ubuntu/backend/.env
            
            # Restart the bot
            sudo systemctl restart botbulls.service
            sudo systemctl status botbulls.service --no-pager
