name: Deploy Backend to Oracle VM

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4



      - name: Native Git Pull and Restart
        uses: appleboy/ssh-action@master
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: PRODUCTION_ENV
          script: |
            # Pull latest changes from GitHub directly on the server
            cd /home/ubuntu/backend
            git fetch origin
            git reset --hard origin/main
            
            # Recreate environment variables
            echo "$PRODUCTION_ENV" > /home/ubuntu/backend/.env
            chmod 600 /home/ubuntu/backend/.env
            
            # Restart the bot
            sudo systemctl restart botbulls.service
            sudo systemctl status botbulls.service --no-pager
