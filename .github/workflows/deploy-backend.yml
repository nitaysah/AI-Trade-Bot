name: Deploy Backend to Oracle VM

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4



      - name: Native Git Pull and Restart
        uses: appleboy/ssh-action@master
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: PRODUCTION_ENV
          script: |
            # Clone if doesn't exist, otherwise fetch and reset
            if [ ! -d "/home/ubuntu/backend/.git" ]; then
              rm -rf /home/ubuntu/backend
              git clone git@github.com:nitaysah/AI-Trade-Bot.git /home/ubuntu/backend
            fi
            
            cd /home/ubuntu/backend
            git fetch origin
            git reset --hard origin/main
            
            # Setup virtual environment if missing, and install dependencies
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install -r backend/requirements.txt
            
            # Recreate environment variables
            if [ -n "$PRODUCTION_ENV" ]; then
              echo "$PRODUCTION_ENV" > /home/ubuntu/backend/.env
              chmod 600 /home/ubuntu/backend/.env
            else
              echo "Warning: PRODUCTION_ENV secret is empty or missing!"
            fi
            
            # Restart the bot
            sudo systemctl restart botbulls.service
            sudo systemctl status botbulls.service --no-pager
