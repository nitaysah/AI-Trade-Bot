name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main

concurrency:
  group: firebase-hosting-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOT_BULLS }}'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase Hosting
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          set +e
          ./node_modules/.bin/firebase deploy --only hosting --project bot-bulls --non-interactive > firebase-deploy.log 2>&1
          status=$?
          cat firebase-deploy.log

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -q "is the current active version" firebase-deploy.log; then
            echo "::notice::Firebase reports this finalized version is already live; treating deploy as successful."
            exit 0
          fi

          exit "$status"
